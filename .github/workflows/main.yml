name: Windows RDP via Tailscale

on:
  workflow_dispatch:
    inputs:
      kunci_masuk:
        description: 'Masukkan Kunci Masuk (Passcode)'
        required: true
        type: string
      tailscale_key:
        description: 'Masukkan Tailscale Auth Key'
        required: true
        type: string
      user:
        description: 'Masukkan Username RDP'
        required: true
        default: 'Arianto'
        type: string
      password:
        description: 'Masukkan Password RDP'
        required: true
        type: string

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Validasi Kunci Masuk dari Web
        env:
          KUNCI_INPUT: ${{ github.event.inputs.kunci_masuk }}
        run: |
          $url = "https://arianto12.lynk.id/p/ganjeng"
          
          try {
              # Mengambil konten dari halaman Lynk.id
              $response = Invoke-WebRequest -Uri $url -UseBasicParsing -TimeoutSec 15
              
              # Menghapus tag HTML dan memisahkan teks berdasarkan baris atau spasi
              $rawText = $response.Content -replace '<[^>]+>', ' '
              $daftarKunci = $rawText -split '[\r\n,]+' | ForEach-Object { $_.Trim() }
              
              # Pengecekan apakah input passcode ada di dalam konten web
              if ($daftarKunci -contains $env:KUNCI_INPUT.Trim()) {
                  Write-Output "Kunci masuk valid. Memulai pembuatan RDP..."
              } else {
                  Write-Error "Kunci masuk salah atau tidak terdaftar di situs web! Akses ditolak."
                  exit 1
              }
          } catch {
              Write-Error "Gagal mengambil data kunci dari situs web. Error: $_"
              exit 1
          }

      - name: Sembunyikan Data Sensitif dari Log
        env:
          TS_KEY: ${{ github.event.inputs.tailscale_key }}
          RDP_PASS: ${{ github.event.inputs.password }}
        run: |
          echo "::add-mask::$env:TS_KEY"
          echo "::add-mask::$env:RDP_PASS"

      - name: Aktifkan Remote Desktop & Buat Pengguna
        env:
          RDP_USER: ${{ github.event.inputs.user }}
          RDP_PASS: ${{ github.event.inputs.password }}
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
          
          $Password = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force
          New-LocalUser -Name $env:RDP_USER -Password $Password -PasswordNeverExpires:$true
          Add-LocalGroupMember -Group "Administrators" -Member $env:RDP_USER

      - name: Set Foto Profil & Wallpaper Desktop
        env:
          RDP_USER: ${{ github.event.inputs.user }}
        run: |
          $avatarUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEjFqQRxOHnZXYINO_52beLKrfrMypBHzpnllWSHx6gQHO4yspMqi2skpfp8z0lvsOOWHjSJ6G33I8Y2rGXo8_FVAkrgnDxtYuWK_Z5go81NcvEoRV6koacWRU4HsXD0R3nqW69a1FJnxhzy2PI8z2PQKqxWIEc_mX3oOROBIj9Y3HW4NcEq6FcNzMyMMwA/s1600/1000184069.jpg"
          $avatarPath = "C:\ProgramData\Microsoft\User Account Pictures"
          
          try {
              Invoke-WebRequest -Uri $avatarUrl -OutFile "C:\avatar.jpg" -UseBasicParsing -ErrorAction Stop
              Copy-Item "C:\avatar.jpg" "$avatarPath\user.png" -Force
              Copy-Item "C:\avatar.jpg" "$avatarPath\user-192.png" -Force
              Copy-Item "C:\avatar.jpg" "$avatarPath\user-448.png" -Force
              Copy-Item "C:\avatar.jpg" "$avatarPath\user-bmp.png" -Force
              
              $userSid = (Get-LocalUser -Name $env:RDP_USER).SID.Value
              $regPath = "HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AccountPicture\Users\$userSid"
              if (!(Test-Path $regPath)) { New-Item -Path $regPath -Force | Out-Null }
              New-ItemProperty -Path $regPath -Name "Image448" -Value "C:\avatar.jpg" -PropertyType String -Force | Out-Null
              New-ItemProperty -Path $regPath -Name "Image192" -Value "C:\avatar.jpg" -PropertyType String -Force | Out-Null
              Write-Output "Foto profil berhasil dipasang."
          } catch {
              Write-Output "Peringatan: Gagal mengunduh foto profil, melewati bagian ini..."
          }

          $wallpaperUrl = "https://blogger.googleusercontent.com/img/b/R29vZ2xl/AVvXsEgRFqAvUV6j9-n3L65cySSsdK3JHZ88fKJlquXCK5pGhNRRlOmYfnIb3Zk4Y7SUC232-P5VcYgFZgiJ7jPfTR4HUmKtiOLG60FzYgby4m52MHOgXB0JuV5KZaR_3tdOPH5USQOqBx2GHYj_KTnntxjNzKKIh0VPFLAOaNoBlVJZi13KPvoWgjRRseVZObA/s1600/1000184023.jpg"
          try {
              Invoke-WebRequest -Uri $wallpaperUrl -OutFile "C:\wallpaper.png" -UseBasicParsing -ErrorAction Stop
              takeown /f "C:\Windows\Web\Wallpaper\Windows\img0.jpg"
              icacls "C:\Windows\Web\Wallpaper\Windows\img0.jpg" /grant Administrators:F
              Copy-Item "C:\wallpaper.png" "C:\Windows\Web\Wallpaper\Windows\img0.jpg" -Force
              Write-Output "Wallpaper berhasil dipasang."
          } catch {
              Write-Output "Peringatan: Gagal mengunduh wallpaper, melewati bagian ini..."
          }

      - name: Install & Hubungkan Tailscale
        env:
          TS_KEY: ${{ github.event.inputs.tailscale_key }}
        run: |
          Invoke-WebRequest -Uri "https://pkgs.tailscale.com/stable/tailscale-setup-latest.exe" -OutFile "tailscale-setup.exe" -UseBasicParsing
          Start-Process -FilePath ".\tailscale-setup.exe" -ArgumentList "/quiet" -Wait
          
          Start-Sleep -Seconds 5
          
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey=$env:TS_KEY --accept-routes

      - name: Menjaga RDP Tetap Aktif
        run: |
          Start-Sleep -Seconds 5
          $tsIp = & "C:\Program Files\Tailscale\tailscale.exe" ip -4
          
          Write-Output "=============================================="
          Write-Output " IP Tailscale RDP : $tsIp"
          Write-Output " Status          : Aktif & Terhubung"
          Write-Output "=============================================="
          
          $counter = 0
          while ($true) {
              Start-Sleep -Seconds 3600
              $counter++
              Write-Output "RDP Masih Berjalan ($counter Jam)..."
          }
