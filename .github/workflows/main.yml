name: ThyoCloud Personal RDP

on:
  workflow_dispatch:
    inputs:
      osChoice:
        description: 'Pilih Versi Windows Server'
        required: true
        type: choice
        default: 'windows-2022'
        options:
          - windows-latest
          - windows-2025
          - windows-2022
      userEmail:
        description: 'Email yang terdaftar di Web ThyoCloud'
        required: true
      customUsername:
        description: 'Username RDP (Default: thyocloud)'
        required: false
        default: 'thyocloud'

jobs:
  build-rdp:
    runs-on: ${{ github.event.inputs.osChoice }}
    timeout-minutes: 360

    steps:
      - name: 🚀 Menghubungkan ke Server ThyoCloud
        env:
          EMAIL: ${{ github.event.inputs.userEmail }}
          USER: ${{ github.event.inputs.customUsername }}
          REPO: ${{ github.event.repository.name }}
          OS_TYPE: ${{ github.event.inputs.osChoice }}
        shell: powershell
        run: |
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "   THYOCLOUD RDP ENGINE INITIATOR" -ForegroundColor Cyan
          Write-Host "==========================================" -ForegroundColor Cyan
          Write-Host "OS Target : $env:OS_TYPE"
          Write-Host "Username  : $env:USER"
          Write-Host "Email     : $env:EMAIL"
          Write-Host "Repository: $env:REPO"
          Write-Host "------------------------------------------"

          $webUrl = "https://thyo.cloud/api/get-core"
          $body = @{
              email    = $env:EMAIL
              username = $env:USER
              repo     = $env:REPO
          } | ConvertTo-Json -Depth 3

          try {
              Write-Host "Verifikasi data ke API ThyoCloud..." -ForegroundColor Yellow
              $req = Invoke-RestMethod -Uri $webUrl -Method Post -Body $body -ContentType "application/json" -TimeoutSec 30

              if ($req.success -eq $true) {
                  Write-Host "✅ Akses Diterima! Menjalankan Core Engine RDP..." -ForegroundColor Green
                  Invoke-Expression $req.script
              } else {
                  Write-Host "⛔ GAGAL: $($req.message)" -ForegroundColor Red
                  Write-Host "Pastikan kamu sudah klaim Token di Web dan Verify di Bot Telegram @ThyoCloudBot" -ForegroundColor Yellow
                  exit 1
              }
          } catch {
              Write-Host "⛔ Terjadi kesalahan jaringan saat menghubungi API ThyoCloud: $_" -ForegroundColor Red
              exit 1
          }
